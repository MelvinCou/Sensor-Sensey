gateway:
  - changed-files:
      - any-glob-to-any-file: gateway/**
github:
  - changed-files:
      - any-glob-to-any-file: .github/**
sensors:
  - changed-files:
      - any-glob-to-any-file: sensors/**
dependencies:
  - changed-files:
      - any-glob-to-any-file: "**/platformio.ini"
documentation:
  - changed-files:
      - any-glob-to-any-file: "**.md"
      - any-glob-to-any-file: docs/**
kicad:
  - changed-files:
      - any-glob-to-any-file: docs/kicad/**

enhancement:
  - head-branch: ["^feature"]
bug:
  - head-branch: ["^fix"]
