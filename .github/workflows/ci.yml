name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - gateway/**
      - sensors/**

jobs:
  clang:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Install clang format
        run: |
          sudo apt-get install --no-install-recommends -qqy clang-format clang-tidy
      - name: Check actual code formatting
        run: |
          ./scripts/format.sh
          git diff --exit-code
      # - name: Lint code
      #   run: |
      #     ./scripts/lint.sh
  pio:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            gateway/.pio
            sensors/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('gateway/platformio.ini', 'sensors/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install APT dependencies
        run: |
          sudo apt-get -qqy update
          sudo apt-get install -qqy libbsd-dev
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO gateway
        working-directory: gateway
        run: pio run

      - name: Build PlatformIO sensors
        working-directory: sensors
        run: pio run
