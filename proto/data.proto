syntax = "proto3";

import "nanopb.proto";
option (nanopb_fileopt).long_names = false;

enum ValueType {
  // types for dust sensor

  vo_raw = 0;
  voltage = 1;
  dust_density = 2;

  // types for pressure sensor

  temperature = 3;
  pressure = 4;
  altitude = 5;
}

message Value {
  // type of the value
  ValueType value_type = 1;

  oneof value {
    // value as an integer
    int32 as_int = 2;
    // value as a float
    float as_float = 3;
  };
}

message Data {
  // id from sensor.community
  string sensor_id = 1 [(nanopb).max_length = 12];
  // pin depending of sensor type
  uint32 sensor_pin = 2;
  // values ​​captured by the sensor
  repeated Value values = 3 [(nanopb).max_count = 3];
}
